[importlinter]
root_packages =
    swarm
    scripts
    redteam
include_external_packages = False

[importlinter:contract:redteam-independent]
name = redteam imports nothing from swarm or scripts
type = forbidden
source_modules = redteam
forbidden_modules =
    swarm
    scripts

[importlinter:contract:verify-chain-independent]
name = scripts.verify_chain imports nothing from swarm
type = forbidden
source_modules = scripts.verify_chain
forbidden_modules = swarm
